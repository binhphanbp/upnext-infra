name: upnext-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  networks:
    - upnext-prod

services:
  frontend:
    <<: *common
    image: ghcr.io/${GITHUB_OWNER:?set GITHUB_OWNER}/upnext-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: upnext-frontend
    env_file:
      - ../env/frontend.prod.env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  backend:
    <<: *common
    image: ghcr.io/${GITHUB_OWNER:?set GITHUB_OWNER}/upnext-be:${BACKEND_IMAGE_TAG:-latest}
    container_name: upnext-backend
    env_file:
      - ../env/backend.prod.env
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http'); const paths=['/health','/api/health']; const check=()=>{const p=paths.shift(); if(!p) process.exit(1); http.get('http://127.0.0.1:4000'+p, r=>process.exit(r.statusCode<500?0:1)).on('error', check)}; check()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: upnext-postgres
    env_file:
      - ../env/postgres.prod.env
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  n8n:
    <<: *common
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    container_name: upnext-n8n
    env_file:
      - ../env/n8n.env
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || wget -qO- http://127.0.0.1:5678/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres-prod-data:
  n8n-data:

networks:
  upnext-prod:
    driver: bridge
